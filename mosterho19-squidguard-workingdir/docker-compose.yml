services:
  squidguard:
    image: mosterho19/squidguard
    container_name: squidguard
    restart: unless-stopped
    ports:
      - "3128:3128"
      - "3129:3129"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squid.conf:/etc/squid/squid.conf
      - ./squidGuard.conf:/etc/squidguard/squidGuard.conf
      - ./squidguard:/var/lib/squidguard
      - ./certificates:/etc/squid/certs

  httpd:
    image: httpd:latest
    container_name: httpd
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squidguarderrors:/usr/local/apache2/htdocs
      - ./www:/usr/local/apache2/htdocs:ro
      - ./apache/pac.conf:/usr/local/apache2/conf/extra/pac.conf:ro
    command: sh -c "a2enmod headers && a2enconf pac && apache2ctl -D FOREGROUND"
