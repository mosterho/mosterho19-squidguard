services:
  squidguard:
    image: mosterho19/squidguard
    container_name: squidguard
    restart: unless-stopped
    ports:
      - "3128:3128"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squid.conf:/etc/squid/squid.conf
      - ./squidGuard.conf:/etc/squidguard/squidGuard.conf
      - ./squidguard:/var/lib/squidguard

  httpd:
    image: httpd:latest
    container_name: httpd
    restart: unless-stopped
    ports:
      - "80:80" # Changed from 8080:80 so browsers can find wpad.dat
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squidguarderrors:/usr/local/apache2/htdocs
      - ./wpad.conf:/usr/local/apache2/conf/extra/wpad.conf # Optional: for MIME type
    command: >
      /bin/sh -c " echo 'AddType application/x-ns-proxy-autoconfig .dat .da .pac' >> /usr/local/apache2/conf/httpd.conf && httpd-foreground " 
