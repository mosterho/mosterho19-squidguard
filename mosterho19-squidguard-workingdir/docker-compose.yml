services:
  squidguard:
    image: mosterho19/squidguard
    container_name: squidguard
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-3128}:3128"
    environment:
      - WPAD_HOST=${WPAD_HOST:-wpad}
      - WPAD_PORT=${WPAD_PORT:-80}
      - PROXY_HOST=${PROXY_HOST:-${WPAD_HOST:-wpad}}
      - PROXY_PORT=${PROXY_PORT:-3128}
      - DOMAIN_NAME=${DOMAIN_NAME:-yourdomain.local}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squid.conf:/etc/squid/squid.conf
      - ./squidGuard.conf.template:/etc/squidguard/squidGuard.conf.template:ro
      - ./squidguard:/var/lib/squidguard
    entrypoint: >
      /bin/sh -c '
      rm -f /run/squid.pid /var/run/squid.pid /var/run/squid/*.pid &&
      sed -e "s|\$${WPAD_HOST}|$${WPAD_HOST}|g" -e "s|\$${WPAD_PORT}|$${WPAD_PORT}|g" /etc/squidguard/squidGuard.conf.template > /etc/squidguard/squidGuard.conf &&
      ln -sf /etc/squidguard/squidGuard.conf /etc/squidguard/squidguard.conf &&
      exec squid -N -d 1'


  httpd:
    image: httpd:latest
    container_name: httpd
    restart: unless-stopped
    ports:
      - "${WPAD_PORT:-80}:80"
    environment:
      - WPAD_HOST=${WPAD_HOST:-wpad}
      - WPAD_PORT=${WPAD_PORT:-80}
      - PROXY_HOST=${PROXY_HOST:-${WPAD_HOST:-wpad}}
      - PROXY_PORT=${PROXY_PORT:-3128}
      - DOMAIN_NAME=${DOMAIN_NAME:-yourdomain.local}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squidguarderrors:/usr/local/apache2/htdocs
      - ./wpad.dat.template:/usr/local/apache2/wpad.dat.template:ro
    command: >
      /bin/sh -c '
      grep -qF "AddType application/x-ns-proxy-autoconfig" /usr/local/apache2/conf/httpd.conf || echo "AddType application/x-ns-proxy-autoconfig .dat .da .pac" >> /usr/local/apache2/conf/httpd.conf &&
      sed -e "s|\$${PROXY_HOST}|$${PROXY_HOST}|g" -e "s|\$${PROXY_PORT}|$${PROXY_PORT}|g" -e "s|\$${DOMAIN_NAME}|$${DOMAIN_NAME}|g" /usr/local/apache2/wpad.dat.template > /usr/local/apache2/htdocs/wpad.dat &&
      cp /usr/local/apache2/htdocs/wpad.dat /usr/local/apache2/htdocs/proxy.pac &&
      httpd-foreground'
