services:
  squidguard:
    image: mosterho19/squidguard
    container_name: squidguard
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-3128}:3128"
    environment:
      - WPAD_HOST=${WPAD_HOST:-wpad}
      - WPAD_PORT=${WPAD_PORT:-80}
      - PROXY_HOST=${PROXY_HOST:-${WPAD_HOST:-wpad}}
      - PROXY_PORT=${PROXY_PORT:-3128}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squid.conf:/etc/squid/squid.conf
      - ./squidGuard.conf:/etc/squidguard/squidGuard.conf
      - ./squidguard:/var/lib/squidguard

  httpd:
    image: httpd:latest
    container_name: httpd
    restart: unless-stopped
    ports:
      - "${WPAD_PORT:-80}:80" # Changed from 8080:80 so browsers can find wpad.dat
    environment:
      - WPAD_HOST=${WPAD_HOST:-wpad}
      - WPAD_PORT=${WPAD_PORT:-80}
      - PROXY_HOST=${PROXY_HOST:-${WPAD_HOST:-wpad}}
      - PROXY_PORT=${PROXY_PORT:-3128}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./squidguarderrors:/usr/local/apache2/htdocs
    command: >
      /bin/sh -c "grep -qF 'AddType application/x-ns-proxy-autoconfig' /usr/local/apache2/conf/httpd.conf || echo 'AddType application/x-ns-proxy-autoconfig .dat .da .pac' >> /usr/local/apache2/conf/httpd.conf && httpd-foreground"
